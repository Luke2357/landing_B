  <style>
  :root{
    /* brand — sampled directly from the designer PDFs (랜딩A/B) */
    --navy:    #17286D;   /* deep navy — logo wordmark + navy accents */
    --navy-700:#11205A;
    --navy-300:#6471A0;
    --amber:   #FFB642;   /* primary amber — buttons, badges */
    --amber-700:#D99800;  /* dark amber / gold — kicker & accent text */
    --cream:   #FFFFFF;   /* page background is white in the design */
    --cream-card:#FFFFFF;
    --cream-line:#E8E8E8; /* neutral light-gray borders & dividers */

    --ink:   #212121;     /* charcoal — headlines, titles, body-dark */
    --muted: #757575;     /* gray — sub copy */
    --faint: #9A9A9A;

    --hl:        #FFE48D; /* headline highlight underline */
    --chat-tint: #FFF2D1; /* light amber chat card background */
    --chat-user: #FFCA60; /* user chat bubble amber */

    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 20px;
    --tap: 48px;

    --font: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, monospace;

    /* notch-aware safe areas (0 on non-notch devices) */
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; scroll-behavior:smooth; }
  html,body{ margin:0; }
  body{
    font-family:var(--font);
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  img{ max-width:100%; display:block; }

  /* ── mobile shell ────────────────────────────────────────────── */
  .m-shell{ min-height:100vh; min-height:100svh; background:var(--cream); }
  /* ── the landing ─────────────────────────────────────────────── */
  .wy{
    max-width:480px; margin:0 auto;
    background:var(--cream); color:var(--ink);
    box-shadow:0 0 0 1px var(--cream-line);
  }

  /* header */
  .wy-head{
    position:sticky; top:var(--safe-top); z-index:30;
    height:54px; display:flex; align-items:center; justify-content:space-between;
    padding:0 18px;
    background:var(--cream);
    border-bottom:1px solid var(--cream-line);
  }
  .wy-logo{ display:flex; align-items:center; gap:7px; font-weight:900; color:var(--navy); font-size:18px; letter-spacing:-.02em; white-space:nowrap; }
  .wy-logo__mark{ display:inline-flex; align-items:center; }
  .wy-logo__mark img{ height:26px; width:auto; display:block; }
  .wy-logo__sub{ font-size:11px; font-weight:500; color:var(--amber-700); margin-left:1px; }
  .wy-lang{
    display:inline-flex; align-items:center; gap:2px; height:34px; padding:3px;
    border:1px solid var(--cream-line); border-radius:999px; background:#fff;
  }
  .wy-lang button{
    appearance:none; border:0; cursor:pointer; font-family:var(--font);
    height:100%; padding:0 11px; border-radius:999px; background:transparent;
    font-size:12px; font-weight:700; color:var(--navy-300); transition:.14s; white-space:nowrap;
  }
  .wy-lang button.on{ background:var(--navy); color:#fff; }

  /* hero */
  .wy-hero{ padding:30px 22px 26px; }
  .wy-eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:700; color:var(--amber-700);
    background:var(--chat-tint); padding:6px 11px; border-radius:999px; margin-bottom:16px; letter-spacing:.01em;
  }
  .wy-h1{ font-size:26px; line-height:1.32; font-weight:900; color:var(--ink); letter-spacing:-.02em; margin:0; text-wrap:balance; }
  .wy-h1 .hl{ background:linear-gradient(transparent 62%, var(--hl) 62%); padding:0 2px; }
  .wy-sub{ margin:14px 0 0; font-size:15px; line-height:1.65; color:var(--muted); text-wrap:pretty; }

  /* buttons */
  .btn-primary{
    appearance:none; border:0; cursor:pointer; font-family:var(--font);
    width:100%; min-height:var(--tap); border-radius:14px;
    background:var(--amber); color:#3A2A06; font-weight:800; font-size:16px; letter-spacing:-.01em;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 8px 18px rgba(255,182,66,.36); transition:.15s;
  }
  .btn-primary:hover{ background:var(--amber-700); transform:translateY(-1px); }
  .btn-primary:active{ transform:translateY(1px); box-shadow:0 4px 10px rgba(255,182,66,.34); }
  .btn-primary:disabled{ background:#E7DBC3; color:#A99B7C; box-shadow:none; cursor:default; transform:none; }
  .btn-ghost-note{ margin-top:10px; text-align:center; font-size:12px; color:var(--faint); }

  /* section heading */
  .wy-sec{ padding:30px 22px 6px; }
  .wy-sec__kicker{ font-size:12px; font-weight:700; color:var(--amber-700); letter-spacing:.04em; text-transform:uppercase; }
  .wy-sec__title{ margin:7px 0 0; font-size:20px; font-weight:800; color:var(--ink); letter-spacing:-.02em; }

  /* feature cards */
  .feat{ display:flex; flex-direction:column; gap:16px; padding:18px 22px 4px; }
  .feat-card{ background:var(--cream-card); border:1px solid var(--cream-line); border-radius:var(--r-lg); padding:14px; box-shadow:0 1px 2px rgba(20,30,50,.03); }
  .feat-card__shot{ width:100%; border-radius:12px; overflow:hidden; display:block; }
  .feat-card__row{ display:flex; align-items:flex-start; gap:12px; margin-top:13px; }
  .feat-card__no{ flex-shrink:0; width:26px;height:26px;border-radius:50%; background:var(--amber); color:#fff; font-weight:800; font-size:13px; display:grid;place-items:center; }
  .feat-card__txt b{ display:block; font-size:15px; font-weight:700; color:var(--ink); }
  .feat-card__txt span{ display:block; margin-top:3px; font-size:13px; line-height:1.55; color:var(--muted); }

  /* ── feature mockups (designer screens; replace striped placeholders) ── */
  .fm{ width:100%; border:1px solid var(--cream-line); border-radius:12px; background:#fff; padding:14px; font-size:12px; color:var(--ink); }
  .fm--amber{ background:var(--chat-tint); border-color:#F4E3BB; }

  /* A1 — 출/퇴근 체크 */
  .fm-att__t{ font-size:13px; font-weight:800; margin-bottom:11px; }
  .fm-att__line{ display:flex; align-items:center; justify-content:space-between; padding:5px 0; }
  .fm-att__k{ color:var(--faint); font-size:11px; }
  .fm-att__v{ font-variant-numeric:tabular-nums; font-weight:700; letter-spacing:.02em; font-size:14px; }
  .fm-att__v--off{ color:#C5CAD1; }
  .fm-att__btns{ display:flex; gap:8px; margin-top:11px; }
  .fm-att__btn{ flex:1; text-align:center; padding:9px 0; border-radius:9px; font-size:12px; font-weight:700; border:1px solid var(--cream-line); background:#fff; color:var(--muted); }
  .fm-att__btn--on{ background:var(--amber); border-color:var(--amber); color:#3A2A06; }

  /* A2 — 임금 기록부 */
  .fm-led__top{ position:relative; text-align:center; font-weight:800; font-size:13px; }
  .fm-led__top .chev{ position:absolute; left:0; top:0; color:var(--faint); font-weight:600; }
  .fm-led__sub{ text-align:center; font-size:10.5px; color:var(--faint); margin-top:2px; }
  .fm-led__hd, .fm-led__rw{ display:grid; grid-template-columns:.8fr 1fr 1.6fr 1.3fr; gap:4px; align-items:center; }
  .fm-led__hd{ font-size:10px; color:var(--faint); padding:12px 0 8px; border-bottom:1px solid var(--cream-line); }
  .fm-led__rw{ font-size:11.5px; font-weight:700; padding-top:11px; }

  /* A3 — 근로내역서 */
  .fm-doc__t{ font-size:13px; font-weight:800; }
  .fm-doc__lead{ font-size:9.5px; color:var(--faint); margin-top:6px; line-height:1.5; }
  .fm-doc__hr{ height:2px; background:var(--ink); margin:9px 0; border-radius:2px; }
  .fm-doc__hd, .fm-doc__rw{ display:grid; grid-template-columns:1fr 1.4fr; gap:4px; }
  .fm-doc__hd{ font-size:10px; color:var(--faint); border-bottom:1px solid var(--cream-line); padding-bottom:6px; }
  .fm-doc__rw{ font-size:11px; padding-top:7px; }

  /* B1 / B2 — 채팅 */
  .fm-chat{ display:flex; flex-direction:column; gap:8px; }
  .fm-chat__label{ font-size:10px; color:var(--muted); align-self:flex-start; margin-bottom:2px; }
  .fm-bub{ max-width:84%; padding:9px 11px; font-size:11.5px; line-height:1.5; border-radius:13px; }
  .fm-bub--bot{ align-self:flex-start; background:#fff; border:1px solid #F0E3C6; border-bottom-left-radius:4px; color:var(--ink); }
  .fm-bub--user{ align-self:flex-end; background:var(--chat-user); color:#3A2A06; border-bottom-right-radius:4px; font-weight:600; }
  .fm-bub--wide{ max-width:100%; }

  /* B2 — 지원센터 정보 카드 */
  .fm-sup{ background:#fff; border:1px solid #F0E3C6; border-radius:10px; padding:10px 11px; margin-top:2px; }
  .fm-sup__hd{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; font-weight:800; color:var(--ink); }
  .fm-sup__more{ font-size:10px; color:var(--faint); font-weight:600; }
  .fm-sup__row{ margin-top:8px; padding-top:8px; border-top:1px solid #F0E8D8; font-size:11px; color:var(--muted); }

  /* B3 — 언어 선택 */
  .fm-lang__row{ display:flex; align-items:center; justify-content:space-between; padding:11px 2px; font-size:12.5px; color:var(--ink); }
  .fm-lang__row + .fm-lang__row{ border-top:1px solid var(--cream-line); }
  .fm-lang__row--on{ font-weight:700; }
  .fm-lang__check{ color:var(--amber-700); font-weight:800; }

  /* ── preregistration section header (above the form card) ─────── */
  .prereg-head{ margin:34px 22px 0; }
  .prereg-head__title{ margin:0 0 8px; font-size:20px; font-weight:900; color:var(--ink); letter-spacing:-.02em; line-height:1.34; }
  .prereg-head__lead{ margin:0; font-size:13.5px; color:var(--muted); line-height:1.6; }

  /* trust badge */
  .trust{ margin:24px 22px 0; }
  .trust-badge{
    display:flex; align-items:center; gap:12px;
    background:#F2EFE7; border:1px solid var(--cream-line); border-radius:14px; padding:14px 15px;
  }
  .trust-badge__ic{ flex-shrink:0; width:38px;height:38px;border-radius:10px; background:#fff; border:1px solid var(--cream-line); display:grid;place-items:center; color:var(--navy); }
  .trust-badge__txt b{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .trust-badge__txt span{ display:block; margin-top:2px; font-size:11.5px; color:var(--faint); }
  .trust-badge__chip{ margin-left:auto; font-size:10.5px; font-weight:700; color:var(--muted); background:#fff; border:1px solid var(--cream-line); padding:4px 8px; border-radius:999px; flex-shrink:0; }

  /* chatbot (B) */
  .bot{ margin:24px 22px 0; background:linear-gradient(180deg,#EDF1F7,#E6ECF5); border:1px solid #DCE3EE; border-radius:var(--r-lg); padding:18px 16px 16px; }
  .bot__top{ display:flex; align-items:center; gap:12px; }
  .bot__char{ width:48px;height:48px;border-radius:50%; flex-shrink:0; overflow:hidden; border:2px solid #fff; box-shadow:0 2px 6px rgba(28,58,99,.18); display:flex; align-items:center; justify-content:center; }
  .bot__name{ font-size:13px; font-weight:800; color:var(--navy); }
  .bot__name span{ display:block; font-size:11px; font-weight:500; color:var(--navy-300); margin-top:1px; }
  .bot__thread{ margin-top:14px; display:flex; flex-direction:column; gap:9px; }
  .bub{ max-width:84%; padding:11px 13px; font-size:13.5px; line-height:1.55; border-radius:15px; }
  .bub--bot{ align-self:flex-start; background:#fff; color:var(--ink); border:1px solid #E1E7F0; border-bottom-left-radius:5px; box-shadow:0 1px 2px rgba(28,58,99,.05); }
  .bub--user{ align-self:flex-end; background:var(--navy); color:#fff; border-bottom-right-radius:5px; }
  .bub--typing{ display:flex; gap:4px; align-items:center; }
  .bub--typing i{ width:6px;height:6px;border-radius:50%;background:var(--navy-300); animation:dot 1s infinite; }
  .bub--typing i:nth-child(2){ animation-delay:.15s; } .bub--typing i:nth-child(3){ animation-delay:.3s; }
  @keyframes dot{ 0%,60%,100%{ transform:translateY(0); opacity:.4;} 30%{ transform:translateY(-4px); opacity:1;} }
  .bot__chips{ margin-top:14px; display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    appearance:none; font-family:var(--font); cursor:pointer;
    min-height:38px; padding:8px 13px; border-radius:999px; font-size:13px; font-weight:600;
    background:#fff; border:1.5px solid var(--navy); color:var(--navy); transition:.14s;
  }
  .chip:hover{ background:var(--navy); color:#fff; }
  .chip:disabled{ opacity:.4; cursor:default; }
  .chip.is-asked{ background:#DDE4EF; border-color:#DDE4EF; color:var(--navy-300); }
  .bot__note{ margin-top:13px; font-size:11px; color:var(--navy-300); line-height:1.5; }

  /* form */
  .form{ margin:14px 22px 0; background:var(--cream-card); border:1px solid var(--cream-line); border-radius:var(--r-lg); padding:20px 17px; box-shadow:0 4px 16px rgba(28,58,99,.06); }
  .form__title{ font-size:18px; font-weight:900; color:var(--navy); letter-spacing:-.02em; }
  .form__lead{ margin:6px 0 16px; font-size:13px; color:var(--muted); line-height:1.55; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  .field label .req{ color:var(--amber-700); margin-left:3px; }
  .field input, .field select{
    width:100%; min-height:46px; font-family:var(--font); font-size:16px; color:var(--ink);
    padding:11px 13px; border:1.5px solid var(--cream-line); border-radius:11px; background:#fff; outline:none; transition:.14s;
  }
  .field input:focus, .field select:focus{ border-color:var(--navy); box-shadow:0 0 0 3px rgba(28,58,99,.1); }
  .field input::placeholder{ color:#B7BDC6; }
  .field.is-error input{ border-color:#D45B4B; box-shadow:0 0 0 3px rgba(212,91,75,.12); }
  .field__hint{ margin-top:6px; font-size:11.5px; line-height:1.45; color:var(--faint); overflow-wrap:anywhere; }
  .field__err{ margin-top:5px; font-size:11.5px; color:#C8462F; font-weight:600; }
  .consent{ display:flex; align-items:flex-start; gap:9px; margin:4px 0 18px; }
  .consent input{ width:20px;height:20px; margin-top:1px; accent-color:var(--navy); flex-shrink:0; }
  .consent label{ font-size:12px; color:var(--muted); line-height:1.5; }
  .consent a{ color:var(--navy); font-weight:600; }
  .form__ok{ text-align:center; padding:14px 4px; }
  .form__ok .ok-ic{ width:54px;height:54px;border-radius:50%; background:#E4F3EA; display:grid;place-items:center; margin:0 auto 12px; color:#2E8B57; }
  .form__ok b{ font-size:17px; color:var(--navy); font-weight:800; }
  .form__ok p{ margin:7px 0 0; font-size:13px; color:var(--muted); line-height:1.6; }

  /* survey + footer */
  .survey{ margin:18px 22px 0; }
  .survey a{
    display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none;
    min-height:46px; border-radius:12px; border:1.5px dashed var(--navy-300); color:var(--navy);
    font-size:13.5px; font-weight:700; background:#fff;
  }
  .survey a:hover{ background:#F5F2EA; }
  .wy-foot{ margin-top:32px; padding:22px 22px calc(40px + var(--safe-bottom)); border-top:1px solid var(--cream-line); background:#F5F0E5; }
  .wy-foot b{ font-size:13px; color:var(--navy); font-weight:800; }
  .wy-foot p{ margin:6px 0 0; font-size:11.5px; color:var(--faint); line-height:1.7; }

  /* striped placeholder (stands in for real assets) */
  .ph{ position:relative; background-color:#EDE6D8;
    background-image:repeating-linear-gradient(45deg, rgba(28,58,99,.06) 0 8px, transparent 8px 16px);
    border:1px solid var(--cream-line); display:flex; align-items:center; justify-content:center; }
  .ph__label{ font-family:var(--mono); font-size:11px; color:var(--navy-300); text-align:center; padding:6px 10px; line-height:1.5; }
  .ph--shot{ aspect-ratio:16/10; border-radius:12px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
  }
  </style>
</head>

  <div id="root"></div>

  <!-- React + Babel via CDN (this is a design mockup / 시안) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/jsx-src" id="wy-app">
  const { useState, useRef, useEffect } = React;

  /* ── version content (Korean reference copy) ───────────────────── */

  const WY_CONTENT = {
    ko: {
      eyebrow: '내 언어로 보는 노동권',
      h1: ['', '내 상황에 맞는 노동 정보,', ' 쉽게 물어보세요.'],
      sub: '복잡한 노동법, 내 언어로, 내 상황에 맞추어 알려드려요. 모르면 손해 보는 권리, 미리 챙기세요.',
      cta: '다운로드하러 가기',
      featKicker: 'With You, 어떻게 쓰나요?',

  /* ── chatbot block (version B only) ────────────────────────────── */
  function Chatbot({ bot, track, t }) {
    const [thread, setThread] = useState([{ from: 'bot', text: bot.greeting }]);
    const [asked, setAsked] = useState([]);
    const [typing, setTyping] = useState(false);
    const opened = useRef(false);
    const threadRef = useRef(null);

    useEffect(() => {
      if (threadRef.current) threadRef.current.scrollTop = threadRef.current.scrollHeight;
    }, [thread, typing]);

    const ask = (chip, i) => {
      if (asked.includes(i) || typing) return;
      if (!opened.current) { opened.current = true; track('chatbot_open'); }
      track('chatbot_chip_click', { q: chip.q });
      setAsked((a) => [...a, i]);
      setThread((t) => [...t, { from: 'user', text: chip.q }]);
      setTyping(true);
      setTimeout(() => {
        setTyping(false);
        setThread((t) => [...t, { from: 'bot', text: chip.a }]);
      }, 900);
    };

    return (
      <div className="bot">
        <div className="bot__top">
          <div className="bot__char ph" role="img" aria-label={bot.name}>
            <span style={{ fontFamily: 'var(--mono)', fontSize: 9, color: '#5B7299' }}>위드유</span>
          </div>
          <div className="bot__name">{bot.name}<span>{t.botSubtitle}</span></div>
        </div>

        <div className="bot__thread" ref={threadRef}>
          {thread.map((m, i) => (
            <div className={`bub ${m.from === 'bot' ? 'bub--bot' : 'bub--user'}`} key={i}>{m.text}</div>
          ))}
          {typing && (
            <div className="bub bub--bot bub--typing"><i></i><i></i><i></i></div>
          )}
        </div>

        <div className="bot__chips">
          {bot.chips.map((c, i) => (
            <button
              key={i}
              className={`chip ${asked.includes(i) ? 'is-asked' : ''}`}
              disabled={asked.includes(i) || typing}
              onClick={() => ask(c, i)}
            >{c.q}</button>
          ))}
        </div>
        <div className="bot__note">{bot.note}</div>
      </div>
    );
  }

  /* ── preregistration form ──────────────────────────────────────── */
  const PREREG_ENDPOINT = 'https://script.google.com/macros/s/AKfycbx-ESX75JRA97Vzeg89d_zaQZ7ia6OlEJtwliVWKTb4vTootpQFLs6qOfcKoactESA/exec';

  function PreregForm({ formRef, track, t }) {
    const f = t.form;
    const [name, setName] = useState('');
    const [contact, setContact] = useState('');
    const [nat, setNat] = useState('');
    const [natOther, setNatOther] = useState('');
    const [agree, setAgree] = useState(false);
    const [errors, setErrors] = useState({});
    const [state, setState] = useState('idle'); // idle | loading | success | error

    const submit = (e) => {
      e.preventDefault();
      track('preregister_submit');
      const err = {};
      if (!name.trim()) err.name = f.errName;
      if (!contact.trim()) err.contact = f.errContact;
      if (!agree) err.agree = f.errAgree;
      setErrors(err);
      if (Object.keys(err).length) return;

      setState('loading');
      fetch(PREREG_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify({
          landingVariant: 'B',
          name: name.trim(),
          contact: contact.trim(),
          nationalityLanguage: nat === 'etc' ? natOther.trim() : nat || '',
          pageUrl: window.location.href,
          userAgent: navigator.userAgent,
          consent: agree
        })
      }).then(() => {
        setState('success');
        track('preregister_success', { nat: nat || 'n/a' });
      }).catch(() => {
        setState('idle');
        track('preregister_error');
        alert('신청 저장 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
      });
    };

    if (state === 'success') {
      return (
        <div className="form" ref={formRef}>
          <div className="form__ok">
            <div className="ok-ic"><Icon name="check" size={26} color="#2E8B57" /></div>
            <b>{f.okTitle}</b>
            <p>{f.okBody[0]}<br/>{f.okBody[1]}</p>
          </div>
        </div>
      );
    }

    const natVals = ['', 'vi', 'km', 'th', 'ko', 'etc'];
    return (
      <form className="form" ref={formRef} onSubmit={submit} noValidate>
        <div className={`field ${errors.name ? 'is-error' : ''}`}>
          <label>{f.name}</label>
          <input type="text" value={name} placeholder={f.namePh} autoComplete="off"
            onChange={(e) => setName(e.target.value)} />
          {errors.name && <div className="field__err">{errors.name}</div>}
        </div>

        <div className={`field ${errors.contact ? 'is-error' : ''}`}>
          <label>{f.contact}</label>
          <input type="text" value={contact} placeholder={f.contactPh} inputMode="text" autoComplete="off" autoCapitalize="none"
            onChange={(e) => setContact(e.target.value)} />
          <div className="field__hint">{f.contactHint}</div>
          {errors.contact && <div className="field__err">{errors.contact}</div>}
        </div>

        <div className="field">
          <label>{f.nat}</label>
          <select value={nat} onChange={(e) => setNat(e.target.value)}>
            {natVals.map((v, i) => <option key={v} value={v}>{f.natOptions[i]}</option>)}
          </select>
          {nat === 'etc' && (
            <input type="text" value={natOther} placeholder={f.natOtherPh} autoComplete="off"
              onChange={(e) => setNatOther(e.target.value)} style={{ marginTop: 8 }} />
          )}
        </div>

        <div className="consent">
          <input id="agree" type="checkbox" checked={agree} onChange={(e) => setAgree(e.target.checked)} />
          <label htmlFor="agree">
            {f.consent}
            {' '}<a href="#" onClick={(e) => e.preventDefault()}>{f.consentMore}</a>
          </label>
        </div>
        {errors.agree && <div className="field__err" style={{ marginTop: -12, marginBottom: 12 }}>{errors.agree}</div>}

        <button className="btn-primary" type="submit" disabled={state === 'loading'}>
          {state === 'loading' ? f.submitting : f.submit}
        </button>
      </form>
    );
  }

  /* ── survey + footer ───────────────────────────────────────────── */

    return (
      <div className="survey">
        <a href="https://forms.gle/gXj9AkY8sLEvjQK4A" target="_blank" rel="noopener noreferrer" onClick={() => track('survey_link_click')}>
          <Icon name="survey" size={17} color="#1C3A63" /> {t.survey}
        </a>
      </div>
    );
  }

  function Footer({ t }) {
    return (
      <footer className="wy-foot">
        <b>With You · 온기(ONGI)</b>
        <p>{t.footer.line1}<br/>
           {t.footer.contact}</p>
      </footer>
    );
  }

  /* ── landing (full-bleed, page-scrolled) ───────────────────────── */
  function Landing({ lang, setLang, track }) {
    const data = WY_CONTENT[lang];
    const t = T[lang];
    const formRef = useRef(null);
    const depth = useRef({ 50: false, 80: false });

    useEffect(() => {
      depth.current = { 50: false, 80: false };
      const onScroll = () => {
        const se = document.scrollingElement || document.documentElement;
        const max = se.scrollHeight - se.clientHeight;
        if (max <= 0) return;
        const pct = (se.scrollTop / max) * 100;
        if (!depth.current[50] && pct >= 50) { depth.current[50] = true; track('scroll_50'); }
        if (!depth.current[80] && pct >= 80) { depth.current[80] = true; track('scroll_80'); }
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      return () => window.removeEventListener('scroll', onScroll);
    }, []);

    const scrollToForm = () => {
      track('cta_click_primary');
      const f = formRef.current;
      if (!f) return;
      const y = f.getBoundingClientRect().top + window.scrollY - 70;
      window.scrollTo({ top: y, behavior: 'smooth' });
    };

    return (
      <div className="wy">
        <Header track={track} lang={lang} setLang={setLang} />
        <Hero data={data} t={t} onCta={scrollToForm} />
        <Features data={data} />
        <Chatbot key={lang} bot={data.bot} track={track} t={t} />
        <Trust trust={data.trust} />
        <section className="prereg-head">
          <h2 className="prereg-head__title">{t.preregTitle[0]}<br/>{t.preregTitle[1]}</h2>
          <p className="prereg-head__lead">{t.preregLead[0]}<br/>{t.preregLead[1]}</p>
        </section>
        <PreregForm formRef={formRef} track={track} t={t} />
        <Survey track={track} t={t} />
        <Footer t={t} />
      </div>
    );
  }

  /* ── app (single-version landing) ─────────────────────────────── */
  const VERSION = 'B';
  function App() {
    const [lang, setLang] = useState('ko');

    const track = (name, params) => {
      const payload = { variant: VERSION, lang, ...(params || {}) };
      console.log('[event]', name, payload);
      if (window.gtag) window.gtag('event', name, payload);
      if (window.clarity) window.clarity('event', name);
      if (window.fbq && name !== 'page_view') {
        if (name === 'preregister_success') {
          window.fbq('track', 'Lead', payload);
        } else {
          window.fbq('trackCustom', name, payload);
        }
      }
    };

    useEffect(() => {
      if (window.clarity) {
        window.clarity('set', 'variant', VERSION);
        window.clarity('set', 'lang', lang);
      }
      track('page_view');
      document.documentElement.lang = lang;
    }, [lang]);

    return (
      <div className="m-shell">
        <Landing lang={lang} setLang={setLang} track={track} />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

    // Compile the JSX source with the classic runtime and run it.

      var out = Babel.transform(src, {
        presets: [['react', { runtime: 'classic' }]],
      }).code;
      var s = document.createElement('script');
      s.textContent = out;
      document.body.appendChild(s);
    })();
  </script>
</body>
